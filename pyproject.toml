[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "see-it-say-it-sorted"
version = "0.1.0"
description = "Evidence-Constrained Reweighting Decoding (ECRD) for training-free visually grounded multimodal reasoning."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "ECRD Authors"}]
dependencies = [
    "torch>=2.1",
    "transformers>=4.46",
    "accelerate>=0.30",
    "pillow>=10.0",
]

[project.optional-dependencies]
grip = ["qwen-vl-utils>=0.0.8"]
qwen = ["qwen-vl-utils>=0.0.8"]

[tool.setuptools.packages.find]
include = ["ecrd*"]
